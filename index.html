<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AN Toys</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AN Toys">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E53935">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --red:#E53935; --orange:#FF7A1A; --navy:#1B2A4A; --cream:#FFF8EC; --muted:#6B7590; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--cream); color:var(--navy); font-family:Poppins,system-ui,-apple-system,sans-serif; }
  .wrap { min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom)); }
  .icon { width:120px; height:120px; border-radius:27px; box-shadow:0 14px 34px rgba(229,57,53,.32); }
  h1 { font-size:26px; font-weight:800; margin:22px 0 4px; }
  p { color:var(--muted); margin:0; font-size:15px; }
  .btn { margin-top:26px; display:inline-block; background:var(--red); color:#fff; text-decoration:none; font-weight:700; font-size:17px; padding:16px 34px; border-radius:16px; box-shadow:0 8px 20px rgba(229,57,53,.32); }
  .how { margin-top:34px; background:#fff; border-radius:18px; padding:16px 18px; max-width:340px; text-align:left; font-size:14px; line-height:1.55; box-shadow:0 2px 10px rgba(27,42,74,.06); }
  .how b { color:var(--navy); }
  .how ol { margin:8px 0 0; padding-left:20px; color:var(--muted); }
  .spin { width:26px; height:26px; margin:26px auto 0; border:3px solid #EADFCB; border-top-color:var(--red); border-radius:50%; animation:s .8s linear infinite; }
  @keyframes s { to { transform:rotate(360deg); } }
  .hide { display:none; }
</style>
</head>
<body>
  <div class="wrap">
    <img class="icon" src="apple-touch-icon.png" alt="AN Toys">
    <h1>AN Toys Stock</h1>
    <p>Products · Stock · Website</p>

    <div id="opening" class="hide"><div class="spin"></div><p style="margin-top:12px">Opening…</p></div>

    <div id="browser">
      <a class="btn" id="open" href="#">Open the app</a>
      <div class="how">
        <b>Put it on your home screen</b>
        <ol>
          <li>Tap the <b>Share</b> button in Safari</li>
          <li>Tap <b>Add to Home Screen</b></li>
          <li>Tap <b>Add</b></li>
        </ol>
      </div>
    </div>
  </div>

<script>
  // The stock app (Google Apps Script web app)
  var APP_URL = 'https://script.google.com/macros/s/AKfycbyAE5H4_WTiSKi4wyqCFov9XI6tYawMjzWweeNHtKSH3yAObnjAkN7LLI4D6ckfgZP4BQ/exec';

  document.getElementById('open').href = APP_URL;

  var standalone = window.navigator.standalone === true ||
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);

  if (standalone) {
    // Opened from the home-screen icon: go straight into the app
    document.getElementById('browser').classList.add('hide');
    document.getElementById('opening').classList.remove('hide');
    setTimeout(function () { window.location.replace(APP_URL); }, 350);
  }
</script>
</body>
</html>
